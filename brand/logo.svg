<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Cero Relleno: un "0" tachado (Ø = conjunto vacío = cero relleno) que a la vez es un botón de play -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e88"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="#0b0614"/>
  <g filter="url(#glow)">
    <!-- el cero -->
    <ellipse cx="256" cy="256" rx="132" ry="164" fill="none" stroke="url(#g)" stroke-width="46"/>
    <!-- play -->
    <path d="M222 190 L318 256 L222 322 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    <!-- el tachón (Ø) -->
    <path d="M118 408 L394 104" stroke="#0b0614" stroke-width="44" stroke-linecap="round"/>
    <path d="M118 408 L394 104" stroke="#19e3d1" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
